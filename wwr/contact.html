<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | WWR School Project</title>
    <meta name="description"
      content="This webpage showcases a contact page for a white water rafting company for the purposes of a multi-week school project. ">
    <meta name="author" content="Caleb J. Erickson">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header class="navigation-bar">
        <nav>
            <img src="images/wwr_logo.png" alt="White Water Rafting Logo for Website. ">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street, Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>

            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=YOUR_GOOGLE_MAP_LINK" width="600"
                  height="350" frameborder="0" style="border:0" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </section>

        <!-- Contact Form Section -->
        <section class="contact-form-section">
            <h2>Get in Touch</h2>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email">

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general"> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message"
                  placeholder="Type your message here"></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="subscribe"> Please subscribe me to the monthly
                    newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <!-- Employee Profiles Section -->
        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="John Smith, River Guide">
                    <figcaption>John Smith – River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Sarah Johnson, Reservation Manager">
                    <figcaption>Sarah Johnson – Reservation Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Mike Davis, Safety Coordinator">
                    <figcaption>Mike Davis – Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <nav class="socialmedia">
            <p>© 2026 White Water Fundamentals Caleb J. Erickson</p>
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook Icon"></a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
