<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Caleb J. Erickson">
</head>

<body>
    <h1>
        <img src="images/basic-logo.png" alt="html layout image" width="128" height="128">
    </h1>
    <nav>
        <u1>
            <li><a href="https://www.pokemon.com/us">Pokemon</a></li>
            <li><a href="https://www.lego.com/en-us">Lego</a></li>
        </u1>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quae, tempora?</p>
        </section>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Architecto, laudantium.</p>
        </section>
    </main>
    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/arequipa-peru/800x1280/5-6c4990c0c9293af076a3bf6bf2e2c9557ae719e1.jpeg"
          alt="Arequipa Peru Temple" width=200>
    </aside>
    <footer>
        <p>Caleb J. Erickson</p>
    </footer>
</body>

</html>
